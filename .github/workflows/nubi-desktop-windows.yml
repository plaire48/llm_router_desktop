name: Nubi Desktop Windows installer
on:
  push:
    branches:
      - codex/nubi-desktop-windows-release*
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  windows-shell-probe:
    runs-on: windows-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Build owned command process helper
        run: node packages/nubi-desktop/scripts/build-process-host.mjs
      - name: Check native Git Bash process ownership before dependency installation
        run: node --test packages/nubi-desktop/tests/git-bash-profile.test.mjs packages/nubi-desktop/tests/windows-process-stop.test.mjs packages/nubi-desktop/tests/windows-git-bash-live.test.mjs packages/nubi-desktop/tests/windows-bash-process.test.mjs
  windows:
    needs: windows-shell-probe
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: packages/nubi-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            packages/nubi-desktop/package-lock.json
            extensions/aipro-chat/package-lock.json
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --prefix ../../extensions/aipro-chat --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix ../nubi-a2a --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix ../nubi-document-agent --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install OpenWiki-SDS locked dependencies
        working-directory: packages/openwiki
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build owned command process helper
        run: node scripts/build-process-host.mjs
      - name: Compile shared runtime before host checks
        run: npm run compile
      - name: Check immutable release inputs before packaging
        shell: pwsh
        run: node scripts/check-release-inputs.mjs --repo ../.. --source-root ../.. --ref $env:GITHUB_SHA --output verification/release-inputs.json
      - name: Check Windows lifecycle and secure connection storage
        run: |
          node --test tests/connection-vault.test.mjs tests/electron-lifecycle.test.mjs tests/connection-readiness.test.mjs tests/model-catalog-refresh.test.mjs tests/project-catalog.test.mjs tests/titlebar-colors.test.mjs tests/git-runtime.test.mjs tests/claude-stream.test.mjs tests/answer-source-integrity.test.mjs tests/model-tool-batch.test.mjs tests/claude-discovery.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test ../nubi-vscode/tests/ghes-account.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify immediate Windows shell cancellation before packaging
        run: |
          node --test tests/windows-process-stop.test.mjs tests/git-bash-profile.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            node --test --test-name-pattern="Bash syntax and missing shell" tests/recovery.test.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify official npm Claude discovery without inherited npm PATH
        run: node scripts/check-windows-claude.mjs
      - name: Verify Unicode shortcut inspection
        shell: pwsh
        run: |
          ./scripts/Test-ShellLink.ps1
          Add-Type -Path scripts/InstallerWindow.cs
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Publish-NubiUpdate.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Verify in-app portal login and SSO recovery
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            node scripts/check-mail-portal-login.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/check-mail-auth-redirects.mjs --home
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Electron installer with bird icon
        env:
          NUBI_UI_OUTPUT: verification/pdf-chat
        run: npm run package:windows
      - name: Verify document connections and PDF chat editing
        env:
          NUBI_NATIVE_UI_OUTPUT: verification/office-preview
          NUBI_EXCEL_BUNDLE_OUTPUT: verification/excel-bundle.json
          NUBI_UI_OUTPUT: verification/pdf-chat
        run: |
          node --test tests/document-all-work.test.mjs tests/pdf-form.test.mjs tests/live-editor-host.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-distribution-capabilities.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-native-excel-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-native-office-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-external-office-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify 1.2.0 fixes
        run: |
          node --test tests/decision-notices.test.mjs tests/human-decisions.test.mjs tests/project-services.test.mjs tests/review-format-recovery.test.mjs tests/ghes-profile-status.test.mjs tests/wiki-repository.test.mjs tests/browser-auth-return.test.mjs tests/mail-portal.test.mjs tests/portal-mail-metadata.test.mjs tests/mail-file-import.test.mjs tests/workspace-community.test.mjs tests/wiki-library.test.mjs tests/result-review.test.mjs tests/memory.test.mjs tests/mail-facts.test.mjs tests/wiki-graph.test.mjs tests/wiki-frontmatter.test.mjs tests/openai-shim.test.mjs tests/judge.test.mjs tests/claude-code.test.mjs tests/conversation-activity.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Nubi skill scope and manual external file browsing
        run: |
          node --test tests/agent-capabilities.test.mjs tests/skill-import.test.mjs tests/skill-marketplace.test.mjs tests/local-file-view.test.mjs tests/workspace-updater.test.mjs tests/agent-question-placeholder.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify PowerShell Korean text and command follow-up admission
        run: |
          node --test --test-concurrency=1 tests/shell-encoding.test.mjs tests/submit-task-message.test.mjs tests/agent-input.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify 1.2.7 terminal wait and MCP approval recovery
        run: |
          node --test --test-concurrency=1 tests/process-idle.test.mjs tests/terminal-stream.test.mjs tests/terminal-mouse.test.mjs tests/powershell-output.test.mjs tests/interactive-terminal.test.mjs tests/setup-actions.test.mjs tests/recovery.test.mjs tests/mcp-approval-flow.test.mjs tests/tool-argument-view.test.mjs tests/mail-browser-login.test.mjs tests/workspace-inquiry-flow.test.mjs tests/mail-auth-lifecycle.test.mjs tests/mail-session-recovery.test.mjs tests/mail-attachment-recovery.test.mjs tests/mail-credential-login.test.mjs tests/mail-portal-bundle.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify resumable mail, large Wiki sources and completion notices
        run: |
          node --test --test-concurrency=1 tests/wiki-large-project.test.mjs tests/git-clone-progress.test.mjs tests/mail-import-resume.test.mjs tests/mail-storage-policy.test.mjs tests/mail-raw-root.test.mjs tests/wiki-notifications.test.mjs tests/answer-notifications.test.mjs tests/answer-source-integrity.test.mjs tests/mail-knowledge.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify startup input recovery and commit graph boundaries
        run: |
          node --test tests/commit-history.test.mjs tests/commit-graph.test.mjs tests/mail-page-execution.test.mjs tests/mail-session-dialog.test.mjs tests/notification-history.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-startup-interaction.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check packaged project navigation before installation
        run: |
          $env:NUBI_TEST_EXECUTABLE = (Resolve-Path 'release/windows/win-unpacked/Nubi Workspace.exe').Path
          $env:NUBI_TEST_WITHOUT_GIT = '1'
          node scripts/check-electron-shell.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-electron-projects.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-project-direct-navigation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-electron-wiki-library.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-source-highlight.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify mail body, attachment scope and search
        run: |
          node --test tests/mail-beta-scope.test.mjs tests/mail-search.test.mjs tests/mail-connection-errors.test.mjs tests/mail-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native OpenWiki initialization and update bridge
        timeout-minutes: 8
        run: |
          New-Item verification -ItemType Directory -Force | Out-Null
          $node = (Get-Command node).Source
          $previousPath = $env:Path
          $env:NUBI_BUNDLED_GIT = (Resolve-Path 'release/windows/win-unpacked/resources/git/cmd/git.exe').Path
          $env:Path = (Split-Path $env:NUBI_BUNDLED_GIT) + ';' + (Split-Path $node) + ';' + $env:SystemRoot + '\System32'
          & $node --test tests/wiki-initialization-flow.test.mjs tests/wiki-plan-completion.test.mjs tests/wiki-update-bundle.test.mjs tests/wiki-update.test.mjs tests/wiki-update-resume.test.mjs tests/wiki-update-view.test.mjs 2>&1 | Tee-Object -FilePath verification/windows-wiki-tests.log
          $wikiExit = $LASTEXITCODE
          $env:Path = $previousPath
          Remove-Item Env:NUBI_BUNDLED_GIT
          if ($wikiExit -ne 0) { exit $wikiExit }
      - name: Verify selected documents and manual mail confirmation recovery
        run: |
          node --test --test-concurrency=1 tests/chat-documents.test.mjs tests/mail-session-dialog.test.mjs tests/mail-portal.test.mjs tests/approval-diagnostics.test.mjs tests/mail-tool-arguments.test.mjs tests/work-plan.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify factual Wiki review and current recovery contracts
        run: |
          node --test --test-concurrency=1 tests/development-workflow.test.mjs tests/browser-saml.test.mjs tests/workspace-inquiry-flow.test.mjs tests/mail-attachment-formats.test.mjs tests/mail-attachment-image.test.mjs tests/wiki-chat-admission.test.mjs tests/wiki-code-map.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify independent OpenWiki semantic review
        working-directory: packages/openwiki
        run: |
          pnpm exec vitest run test/agent/repository-semantic-review.test.ts test/agent/repository-runner.test.ts test/agent/repository-prompts.test.ts test/generation/repository-run.test.ts test/ingestion/code-mode.test.ts test/claims/brains/code/store.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download verified upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'nubi-desktop-baseline'
          New-Item $baseline -ItemType Directory -Force | Out-Null
          gh release download nubi-desktop-v1.1.7 --repo plaire48/llm_router_desktop --pattern '*-Setup.exe' --dir $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $previous = (Get-ChildItem $baseline/*-Setup.exe | Select-Object -First 1).FullName
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLower() -ne '481d26c4ca58197e2093f3a973efc5b0801c0a9c0a8baf2cee652e0577bda91a') { throw 'Baseline checksum mismatch' }
          "NUBI_BASELINE_INSTALLER=$previous" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed app, icon, upgrade, reinstall and uninstall
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/Test-WindowsInstaller.ps1
      - name: Prepare verified installer payload for gated draft
        shell: pwsh
        run: |-
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $reports = 'distribution-capabilities.json','excel-bundle.json','electron-shell.json','electron-first-install.json','electron-projects.json','electron-projects.png','electron-projects-narrow.png','windows-installer.json','windows-branding.json','installed-icon.png','windows-package.json','windows-claude.json','windows-installer-experience.json','windows-installer-progress.png','windows-installer-finish.png','windows-installer-notice.png' | ForEach-Object { (Resolve-Path (Join-Path 'verification' $_)).Path }
          Compress-Archive -Path verification/* -DestinationPath release/windows/verification.zip
          $files = @((Get-ChildItem release/windows/*-Setup.exe).FullName) + @((Get-ChildItem release/windows/*.sha256).FullName) + $reports + @('release/windows/verification.zip','scripts/Publish-NubiUpdate.ps1','docs/WINDOWS-UPDATE-DEPLOYMENT.md','THIRD-PARTY-NOTICES.md',"docs/HOTFIX-$version.md","docs/INSTALL-AND-UPDATE-$version.md")
          $payload = New-Item release/draft-payload -ItemType Directory -Force
          foreach ($file in $files) { Copy-Item $file $payload }
          Copy-Item "docs/HOTFIX-$version.md" (Join-Path $payload 'release-notes.txt')
          $manifest = @(Get-ChildItem $payload -File | ForEach-Object { @{ name=$_.Name; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } })
          @{ version=$version; commit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; files=$manifest } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $payload 'candidate.json') -Encoding utf8
      - name: Pass installer payload to the gated draft job
        uses: actions/upload-artifact@v4
        with:
          name: nubi-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/nubi-desktop/release/draft-payload/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nubi-windows-diagnostics
          path: packages/nubi-desktop/verification/
          retention-days: 7
  gates-full:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      NUBI_SAFETY_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
      NUBI_SAFETY_REF: ${{ github.sha }}
      # A GitHub-hosted Windows runner is shared hardware: timing limits are recorded unjudged, as in the Linux gates
      # (§8 답 15). Functional checks stay judged.
      NUBI_SHARED_RUNNER: "1"
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: packages/nubi-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            packages/nubi-desktop/package-lock.json
            extensions/aipro-chat/package-lock.json
            packages/nubi-a2a/package-lock.json
            packages/nubi-document-agent/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix ../../extensions/aipro-chat --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix ../nubi-a2a --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix ../nubi-document-agent --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Unit tests read Office workbooks through the nubi-office dependencies, as the Linux gates install them.
          npm ci --prefix ../nubi-office --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked OpenWiki dependencies
        working-directory: packages/openwiki
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Chrome channel
        run: npx --no-install playwright install chrome
      - name: Build owned process helper
        run: node scripts/build-process-host.mjs
      # The Windows Electron build requires the browser window bridge (build-electron.mjs throws without it on win32).
      - name: Build browser window bridge
        run: node scripts/build-browser-window-bridge.mjs
      - name: Check gate coverage
        run: node scripts/check-gate-coverage.mjs
      - name: Check complete release source patterns
        continue-on-error: true
        run: node scripts/check-safety-regression.mjs --tree $env:GITHUB_SHA --output verification/safety-tree.json
      # The unit tests import generated/openwiki.mjs, which only the runtime compile produces (run 39521986002 failed
      # 382 test files without it). The Linux gates compile before the same step.
      - name: Compile shared runtime
        run: npm run compile
      - name: Run fast gates
        id: fast
        run: npm run test:gates:fast
      - name: Run Electron gates even after a fast-gate failure
        if: ${{ !cancelled() && steps.fast.outcome != 'skipped' }}
        run: npm run test:gates:electron
      - name: Build and inspect actual release payload
        if: ${{ !cancelled() && steps.fast.outcome != 'skipped' }}
        run: node scripts/package-windows.mjs --payload-only
      - name: Preserve safety source audit and payload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nubi-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/nubi-desktop/verification/safety-*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve failed-check screenshots and measurements
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nubi-desktop-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/nubi-desktop/verification/**/*.png
            packages/nubi-desktop/verification/**/*.json
            packages/nubi-desktop/verification/**/*.cpuprofile
            packages/nubi-desktop/verification/**/*.log
          retention-days: 7
          if-no-files-found: warn
  save-draft:
    if: ${{ needs.windows.result == 'success' && needs.gates-full.result == 'success' }}
    needs:
      - windows
      - gates-full
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run and attempt only
        uses: actions/download-artifact@v4
        with:
          name: nubi-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: draft-payload
      - name: Save private draft only after packaging and full gates succeed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |-
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.private'
          if ($LASTEXITCODE -ne 0 -or $private -ne 'true') { throw 'Private build repository required' }
          $payload = (Resolve-Path draft-payload).Path
          $candidate = Get-Content (Join-Path $payload 'candidate.json') -Raw | ConvertFrom-Json
          if ($candidate.commit -ne $env:GITHUB_SHA -or $candidate.runId -ne $env:GITHUB_RUN_ID -or $candidate.runAttempt -ne $env:GITHUB_RUN_ATTEMPT) { throw 'Candidate run binding mismatch' }
          $files = @()
          foreach ($file in $candidate.files) {
            if ((Split-Path $file.name -Leaf) -ne $file.name) { throw 'Invalid candidate path' }
            $resolved = Join-Path $payload $file.name
            if ((Get-FileHash $resolved -Algorithm SHA256).Hash.ToLower() -ne $file.sha256) { throw 'Candidate checksum mismatch' }
            $files += $resolved
          }
          $tag = "nubi-desktop-v$($candidate.version)-run-$env:GITHUB_RUN_ID"
          $existingJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = @($existingJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($existing.Count) { throw 'Draft already exists; inspect it instead of overwriting' }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --prerelease --target $env:GITHUB_SHA --title "누비 Workspace Beta Windows x64 ($env:GITHUB_RUN_ID)" --notes-file (Join-Path $payload 'release-notes.txt') @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
