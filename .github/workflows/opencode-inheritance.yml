name: OpenCode integration regression

on:
  pull_request:
    paths:
      - "src/llm_router/**"
      - "tests/**"
      - "tools/check_opencode_inheritance.py"
      - "opencode_build.py"
      - "pyproject.toml"
      - ".github/workflows/opencode-inheritance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel and test dependencies
        run: python -m pip install ".[dev]"
      - name: Check source contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Exercise bundled official engine against a local scripted provider
        run: python tools/check_opencode_inheritance.py
