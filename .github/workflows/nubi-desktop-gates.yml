name: Nubi Desktop gates
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: desktop-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gates-fast:
    # Three parallel parts: unit-a/unit-b split test filenames in sorted halves;
    # "ui" runs the remaining fast checks. scripts/run-gate-part.mjs partitions the same
    # package.json chain that check-gate-coverage verifies, so coverage and order stay intact.
    name: gates-fast (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [unit-a, unit-b, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: packages/nubi-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            packages/nubi-desktop/package-lock.json
            extensions/aipro-chat/package-lock.json
            packages/nubi-a2a/package-lock.json
            packages/nubi-document-agent/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix ../../extensions/aipro-chat --ignore-scripts
          npm ci --prefix ../nubi-a2a --ignore-scripts
          npm ci --prefix ../nubi-document-agent --ignore-scripts
          npm ci --prefix ../nubi-office --ignore-scripts
          npm ci
      - name: Install locked OpenWiki dependencies
        working-directory: packages/openwiki
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chrome channel
        if: matrix.part == 'ui'
        run: npx --no-install playwright install --with-deps chrome
      - name: Compile shared runtime
        run: npm run compile
      - name: Check gate coverage
        run: node scripts/check-gate-coverage.mjs
      - name: Reset timing marker for this run
        run: rm -f verification/unjudged.json
      - name: Run fast gates (${{ matrix.part }})
        run: node scripts/run-gate-part.mjs ${{ matrix.part }}
        timeout-minutes: 20
      - name: Summarize unjudged timing checks
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          let entries=[];
          try {
            const marker=JSON.parse(await readFile('verification/unjudged.json','utf8'));
            if(marker.version!==1||!Array.isArray(marker.entries)||marker.runId!==process.env.GITHUB_RUN_ID+':'+process.env.GITHUB_RUN_ATTEMPT)throw Error('invalid timing marker');
            entries=marker.entries;
            if(entries.some(e=>e.verdict!=='unjudged'||e.functionalPassed!==true))throw Error('invalid unjudged entry');
          } catch(error) {if(error.code!=='ENOENT')throw error;}
          const text='미판정 '+entries.length+'건';
          console.log(text);
          await appendFile(process.env.GITHUB_STEP_SUMMARY,'### '+text+'\n\n기능 단언은 계속 판정합니다. 미판정 시간 항목은 목표 환경에서 별도 확인해야 합니다.\n'+entries.map(e=>'- '+e.id+' ('+e.reason+')').join('\n')+'\n');
          NODE
      - name: Preserve failed-check screenshots and measurements
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nubi-desktop-fast-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/nubi-desktop/verification/**/*.png
            packages/nubi-desktop/verification/**/*.json
            packages/nubi-desktop/verification/**/*.cpuprofile
            packages/nubi-desktop/verification/**/*.log
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve unjudged timing measurements
        if: success() && hashFiles('packages/nubi-desktop/verification/unjudged.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nubi-desktop-unjudged-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/nubi-desktop/verification/**/*.png
            packages/nubi-desktop/verification/**/*.json
            packages/nubi-desktop/verification/**/*.cpuprofile
            packages/nubi-desktop/verification/**/*.log
          retention-days: 7
          if-no-files-found: error
    env:
      NUBI_SAFETY_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
      NUBI_SAFETY_REF: ${{ github.sha }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NUBI_SHARED_RUNNER: "1"
