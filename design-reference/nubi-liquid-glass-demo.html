<head>

<title>Nubi Workspace — Liquid Glass Prototype</title>
<style>
  :root { color-scheme: light; --ink:#24314d; --muted:#65738c; --accent:#7768db; }
  *, *::before, *::after { box-sizing: border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:#e9eef7; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  .page { max-width:1190px; margin:0 auto; padding:22px 16px 18px; }
  .stage { height:706px; position:relative; isolation:isolate; overflow:hidden; border-radius:32px; background:#e7edf8; border:1px solid rgba(255,255,255,.9); box-shadow:0 24px 80px #43588229, 0 1px 3px #6e8bb326; }
  .bg-canvas, .glass-canvas { position:absolute; inset:0; display:block; width:100%; height:100%; }
  .bg-canvas { z-index:0; }
  .glass-canvas { z-index:2; pointer-events:none; }
  .chrome { position:absolute; z-index:3; top:0; left:0; width:100%; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 31px; border-bottom:1px solid #ffffff5e; background:linear-gradient(180deg,#ffffff4b,transparent); }
  .chrome-left,.chrome-right { display:flex; align-items:center; gap:18px; }
  .traffic { display:flex; align-items:center; gap:7px; }
  .traffic i { width:11px; height:11px; border-radius:50%; background:#ee9d9f; border:1px solid #ffffff60; }
  .traffic i:nth-child(2){ background:#edca85; }.traffic i:nth-child(3){background:#a4d8b3;}
  .chrome-name { font-size:12px; font-weight:700; letter-spacing:.025em; color:#6e7c99; }
  .chrome-right { gap:11px; color:#71809d; font-size:11px; font-weight:700; letter-spacing:.09em; }
  .live-led { width:6px;height:6px;border-radius:50%;background:#56bd9b;box-shadow:0 0 0 4px #65c8a723; }
  .avatar { display:grid; place-items:center; height:29px; width:29px; margin-left:10px; background:#8d93b1; color:white; border-radius:50%; font-size:12px; font-weight:800; box-shadow:inset 0 1px 1px #ffffff6b,0 2px 6px #65739138; }
  .brand { position:absolute; z-index:3; left:60px; top:100px; display:flex;align-items:center;gap:10px; color:#2d3854; font-weight:800;font-size:17px;letter-spacing:-.06em; }
  .brand-icon { width:29px; height:29px; position:relative; display:block; filter:drop-shadow(0 2px 3px #5e76ae38); }
  .brand-icon::before { content:"";position:absolute;width:22px;height:23px;top:2px;left:2px;background:linear-gradient(135deg,#64c5e0,#8a77e0 76%);border-radius:65% 40% 62% 38%;transform:rotate(-27deg); }
  .brand-icon::after { content:"";position:absolute;width:11px;height:11px;top:2px;right:0;background:linear-gradient(140deg,#e5b9f3,#9acdf5);border-radius:50%;box-shadow:inset 0 2px 3px #ffffff77; }
  .hero { position:absolute;z-index:3;left:60px;top:140px;width:min(600px,65%);pointer-events:none; }
  .eyebrow { display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.19em;font-weight:800;color:#7985a0;margin-bottom:17px; }
  .eyebrow i {display:block;width:16px;height:1px;background:#7587c7;}
  h1 { white-space:pre-line; font-weight:710; font-size:clamp(38px,5.4vw,65px); line-height:1.045; letter-spacing:-.061em; color:#202d49; margin:0; min-height:140px; transition: opacity .22s ease,transform .28s ease; }
  .hero p {font-size:14px;line-height:1.75;color:#66768e;letter-spacing:-.015em;margin:16px 0 0;transition:opacity .22s ease;}
  .orb { position:absolute; z-index:3; width:179px;height:179px;top:144px;right:120px; cursor:grab;touch-action:none;user-select:none; border:0; background:transparent; border-radius:50%; transition:transform .2s ease; }
  .orb:active {cursor:grabbing;transform:scale(.985);} .orb:focus-visible{outline:2px solid #8876d8;outline-offset:3px;}
  .orb-center {pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;color:#526078;text-align:center;}
  .orb-center svg { width:29px;height:29px;stroke:#6179a6;filter:drop-shadow(0 1px 0 #fff8); }
  .orb-center span {font-size:9px;font-weight:800;letter-spacing:.18em;color:#66728a;}
  .orb-hint {z-index:3;position:absolute;right:138px;top:341px;font-size:10px;letter-spacing:.015em;color:#7986a2;font-weight:600;user-select:none;}
  .segment {position:absolute;left:59px;top:399px;z-index:3;width:324px;height:51px;display:flex;align-items:stretch;padding:5px;border-radius:30px;}
  .segment-pill {position:absolute;z-index:0;top:5px;height:41px;width:104px;left:5px;pointer-events:none;border-radius:999px; }
  .segment button {position:relative;z-index:1;flex:1;min-width:0;background:none;border:none;color:#7c89a1;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border-radius:23px;cursor:pointer;transition:color .18s;}
  .segment button[aria-selected="true"] {color:#283b60;}
  .segment button:focus-visible{outline:2px solid #9988e6;outline-offset:4px;}
  .summary-grid { position:absolute;z-index:3;top:464px;left:59px;right:59px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .summary-card {height:129px;border:0;text-align:left;color:var(--ink);padding:21px 20px;background:transparent;border-radius:27px;cursor:pointer;position:relative;overflow:hidden;transition:transform .22s ease; }
  .summary-card:hover {transform:translateY(-4px);}.summary-card:active{transform:translateY(-1px) scale(.985)}
  .summary-card:focus-visible{outline:2px solid #9783e1;outline-offset:3px;}
  .card-head {display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .mini-icon {display:grid;place-items:center;width:29px;height:29px;border-radius:11px;background:#a5a0e32c; color:#7a6dc9;}
  .mini-icon svg {width:17px;height:17px;stroke-width:1.9;}
  .summary-card:nth-child(2) .mini-icon{background:#66bace28;color:#2798ad;} .summary-card:nth-child(3) .mini-icon{background:#db9fc033;color:#c077a4;}
  .card-arrow {width:16px;height:16px;stroke:#8896ac;stroke-width:1.8;}
  .card-title {font-size:13px;font-weight:730;letter-spacing:-.02em;margin-bottom:5px;color:#33415d;}
  .card-desc {font-size:11px;color:#75839e;font-weight:500;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-val {position:absolute;right:18px;bottom:18px;color:#425173;font-size:21px;font-weight:690;letter-spacing:-.035em;}
  .dock {position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:28px;width:560px;max-width:calc(100% - 52px);height:74px;display:flex;justify-content:space-between;padding:6px;border-radius:45px;}
  .dock-pill {position:absolute;z-index:0;left:6px;top:6px;width:109.6px;height:62px;pointer-events:none;border-radius:999px;}
  .dock button {flex:1;min-width:0;border:0;border-radius:36px;position:relative;z-index:1;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#74829d;transition:color .2s ease;}
  .dock button svg {width:21px;height:21px;stroke-width:1.85;transition:transform .35s cubic-bezier(.2,1.4,.2,1);}
  .dock button:hover svg {transform:translateY(-2px);}
  .dock button span {font-size:10px;letter-spacing:-.025em;font-weight:680;}
  .dock button[aria-current="page"] {color:#364969;}
  .dock button[aria-current="page"] svg {transform:translateY(-1px) scale(1.07);}
  .dock button:focus-visible{outline:2px solid #9585dd;outline-offset:0;}
  .footer-note {position:absolute;left:60px;bottom:51px;z-index:3;color:#8d98ae;font-size:9px;letter-spacing:.13em;font-weight:750;}
  .hint {display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:15px 8px 0;color:#687891;font-size:12px;font-weight:600;}
  .controls {display:flex;align-items:center;gap:17px;}
  .strength {display:flex;align-items:center;gap:11px;}
  .strength input {appearance:none;-webkit-appearance:none;width:122px;height:5px;border-radius:99px;background:linear-gradient(to right,#7978d7 0%,#81b1da 80%,#c7d2e5 80%);cursor:pointer;}
  .strength input::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border:3px solid white;background:#7b7bdb;box-shadow:0 1px 7px #4d68a342;border-radius:50%;}
  .strength input::-moz-range-thumb{width:10px;height:10px;border:3px solid white;background:#7b7bdb;box-shadow:0 1px 7px #4d68a342;border-radius:50%;}
  .switch {font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#596f93;border:1px solid #cad6e9;background:#ffffff8c;border-radius:99px;cursor:pointer;padding:9px 12px;white-space:nowrap;}
  .switch[aria-pressed="false"]{color:#909aad;background:#e5eaf3;}
  .switch:focus-visible,.strength input:focus-visible{outline:2px solid #8f80da;outline-offset:3px;}
  @media(max-width:900px){ .hero{width:70%;}.orb{right:7%;width:146px;height:146px;top:174px}.orb-hint{right:8%;top:330px}.footer-note{display:none;} .summary-card{padding:17px 16px}.card-val{font-size:18px;} }
  @media(max-width:620px){
    .page{padding:10px 8px 18px;}
    .stage{height:837px;border-radius:25px;}
    .chrome{height:56px;padding:0 18px;}.chrome-right{font-size:9px;gap:7px}.chrome-name{display:none}.avatar{margin-left:2px}
    .brand{top:82px;left:25px;}
    .hero{top:137px;left:25px;width:calc(100% - 40px);}
    .eyebrow{margin-bottom:13px;font-size:9px;}
    h1{font-size:clamp(39px,10.5vw,51px);min-height:105px;}
    .hero p{font-size:12px;margin-top:10px;max-width:235px;line-height:1.6;}
    .orb{width:111px;height:111px;right:23px;top:304px;}
    .orb-center svg{width:22px;height:22px}.orb-center span{font-size:7px}
    .orb-hint{right:22px;top:421px;font-size:9px;}
    .segment{top:349px;left:23px;width:min(288px,calc(100% - 151px));min-width:225px;height:48px;padding:4px;}
    .segment-pill{top:4px;left:4px;height:40px;}
    .segment button{font-size:10px;}
    .summary-grid{top:465px;left:22px;right:22px;grid-template-columns:1fr;gap:9px;}
    .summary-card{height:84px;padding:11px 18px;border-radius:23px;}
    .card-head{margin-bottom:2px;}.mini-icon{width:24px;height:24px;border-radius:9px;}.mini-icon svg{width:15px;height:15px;}
    .card-title{font-size:12px;margin-bottom:3px}.card-desc{font-size:10px}.card-val{bottom:14px;right:19px;}
    .dock{height:68px;bottom:17px;max-width:calc(100% - 28px);padding:5px;}
    .dock-pill{height:58px;top:5px;left:5px;}
    .dock button svg{width:19px;height:19px;}.dock button span{font-size:9px;}
    .hint{font-size:11px;align-items:flex-start;}.controls{gap:10px;}.strength input{width:85px;}
  }
  @media(max-width:390px){.orb{right:20px;width:98px;height:98px;top:300px}.orb-hint{right:16px;top:404px}.segment{min-width:205px;}.segment button{font-size:9px;} }
  @media(prefers-reduced-motion:reduce){.summary-card,.dock button svg,.orb{transition:none;}}
</style>
</head>
