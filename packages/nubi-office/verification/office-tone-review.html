<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>누비 Office UI 검토</title>
<style>body{margin:0;padding:32px;background:#f1f7fe;color:#191f28;font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto}h1{font-size:24px}p{color:#4e5968}select{font:inherit;padding:8px 12px;background:white;border:1px solid #e5e8eb;border-radius:12px}label{margin-right:12px}section{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px}figure{margin:0;max-width:100%}figcaption{margin:8px 0;color:#4e5968}img{display:block;max-width:100%;height:auto;border-radius:20px;box-shadow:0 14px 44px #191f2817}a{color:#1b64da}:focus-visible{outline:3px solid #3182f6;outline-offset:4px}</style></head><body><main><h1>누비 Office</h1><p>HTML의 색감과 카드, 아이콘, 여백을 작업창에 맞췄습니다.</p><label for="screen">화면</label><select id="screen"><option value="welcome">첫 화면</option><option value="catalog">양식 목록</option><option value="template-info">양식 정보</option><option value="models">모델 선택</option><option value="progress">도구 실행</option><option value="question">질문</option><option value="recovery">복구 확인</option><option value="approval">저장 확인</option></select><p>소스에서 렌더링한 예시입니다. 회사 모델 호출과 실제 Office 실행 결과는 아닙니다.</p><section><figure><figcaption>360px 작업창</figcaption><img id="narrow" src="office-tone-welcome-360.png" alt="첫 화면 360px 소스 미리보기" width="360" height="850"></figure><figure><figcaption>480px 작업창</figcaption><img id="wide" src="office-tone-welcome-480.png" alt="첫 화면 480px 소스 미리보기" width="480" height="850"></figure></section><p><a href="../docs/UI-TONE-HARNESS-BP-2026-09-23.md">BP 비교와 적용 범위</a></p></main><script>document.querySelector('select').addEventListener('change',event=>{for(const [id,width] of [['narrow',360],['wide',480]]){const image=document.getElementById(id);image.src='office-tone-'+event.target.value+'-'+width+'.png';image.alt=event.target.selectedOptions[0].text+' '+width+'px 소스 미리보기';}});</script></body></html>
