<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><title>누비 for Excel</title><link rel="stylesheet" href="/cx.css"><link rel="stylesheet" href="/app.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer src="/app.js"></script></head>
<body><div class="app">
  <header class="header"><button id="new-chat" class="nubi-logo" title="새 대화" aria-label="새 대화"><img src="/icons/agent-bird.png" width="32" height="32" alt=""><img class="nubi-wordmark" src="/icons/nubi-wordmark.png" width="42" height="24" alt="누비"><span class="nubi-beta">Excel</span></button><div class="header-actions"><button id="history-toggle" class="icon-button" aria-label="대화 기록" title="대화 기록" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6M12 7v5l3 2"/></svg></button><button id="settings-toggle" class="icon-button" aria-label="연결 설정" aria-expanded="false" title="연결 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></header>
  <section id="history-panel" class="settings" hidden aria-label="대화 기록"><div class="section-title"><h2>대화 기록</h2><button id="history-close" class="icon-button" aria-label="대화 기록 닫기">×</button></div><p class="hint">이 창에서 나눈 대화를 이어갑니다.</p><div id="history-list"></div></section>
  <div id="status" role="status" class="status">Excel에 연결하는 중…</div>
  <section id="settings" class="settings" hidden aria-label="연결 설정">
    <div class="section-title"><h2>AI Pro 연결</h2><button id="settings-close" class="icon-button" aria-label="설정 닫기">×</button></div>
    <button id="login" class="primary wide">브라우저로 로그인</button><button id="cancel-login" class="secondary wide" hidden>로그인 취소</button>
    <p class="hint">회사 AI Pro 계정으로 연결합니다.</p>
    <button id="cli-toggle" class="text-button" aria-expanded="false">AI Pro CLI로 연결</button>
    <form id="cli-form" hidden autocomplete="off"><label for="base-url">Base URL</label><input id="base-url" type="url" placeholder="https://서버주소/v1" required><label for="token">토큰</label><input id="token" type="password" required autocomplete="off"><label for="model-id">Model ID</label><input id="model-id" required maxlength="200"><button class="secondary wide" type="submit">연결 설정 저장</button></form>
    <p class="hint">인증값은 이 연결 서버가 실행되는 동안만 유지됩니다.</p><button id="disconnect" class="text-button" hidden>연결 해제</button>
  </section>
  <div id="connection" class="connection"><span id="connection-label">연결 필요</span><label class="sr-only" for="model">AI Pro 모델</label><select id="model" disabled><option>모델 선택</option></select></div>
  <main id="conversation" class="conversation" aria-label="작업 대화">
    <section id="welcome" class="welcome"><div class="welcome-art" aria-hidden="true"><span class="welcome-emblem"><span class="agent-mark" data-mood="idle"><img class="bird-base" src="/icons/agent-bird.png" alt=""><img class="bird-frame bird-blink" src="/icons/agent-blink.png" alt=""><img class="bird-frame bird-wing" src="/icons/agent-wing.png" alt=""><img class="bird-frame bird-smile" src="/icons/agent-smile.png" alt=""><img class="bird-frame bird-sad" src="/icons/agent-sad.png" alt=""></span></span></div><div class="agent-intro"><h2>엑셀을 누비는 AI Agent, 누비</h2><p>작은 뱁새에게 표 작업을 맡겨보세요.<br>셀을 읽고, 수정하고, 결과까지 확인합니다.</p></div><h3 class="welcome-title">누비에게 <span>무엇을 맡길까요?</span></h3><div class="examples"><button data-request="선택한 표에서 핵심 내용을 요약해줘" data-mode="analyze">선택한 표 요약 <span aria-hidden="true">↗</span></button><button data-request="선택 범위의 첫 행을 굵게 하고 연한 파란색 배경을 적용해줘" data-mode="edit">머리글 서식 정리 <span aria-hidden="true">↗</span></button><button data-request="선택한 표의 빈 합계 셀에 SUM 수식을 넣어줘" data-mode="edit">합계 수식 채우기 <span aria-hidden="true">↗</span></button></div></section>
    <div id="trace-panel" class="trace-panel" hidden><button id="trace-toggle" class="text-button" aria-expanded="true">작업 과정</button><ol id="trace-list"></ol></div>
  </main>
  <footer class="composer"><div class="scope"><span aria-hidden="true">▦</span><span id="scope-label">Excel에서 셀을 선택하세요</span><button id="refresh-selection" class="icon-button" aria-label="선택 범위 새로 읽기" title="선택 범위 새로 읽기">↻</button></div><form id="request-form"><label class="sr-only" for="request">Excel 작업 요청</label><textarea id="request" rows="3" maxlength="8000" placeholder="누비에게 맡길 일을 적어주세요"></textarea><div class="composer-actions"><label class="sr-only" for="mode">작업 방식</label><select id="mode"><option value="analyze">분석만</option><option value="edit">셀 수정</option></select><div class="composer-tools"><button id="stop" type="button" class="icon-button" aria-label="중지" title="중지" hidden>■</button><button id="submit" type="submit" class="primary" aria-label="전송" title="전송" disabled>↑</button></div></div></form><p class="footnote">선택 범위만 AI Pro로 전송됩니다. 셀 수정은 바로 적용됩니다.</p></footer>
</div></body></html>
