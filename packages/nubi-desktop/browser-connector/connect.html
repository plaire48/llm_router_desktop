<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>누비 브라우저 연결</title><link rel="stylesheet" href="connect.css"><body><header><span class="brand"><img src="nubi.png" alt="" width="28" height="28"></span><strong>누비에 연결</strong></header><main><p>현재 탭을 누비 에이전트와 연결해요.</p><label for="code">누비에서 복사한 연결 코드</label><input id="code" autocomplete="off" spellcheck="false" placeholder="연결 코드 붙여넣기"><button id="connect">연결</button><p id="status" role="status"></p><button id="mail" hidden>현재 포털의 메일 읽기 허용</button><button id="disconnect" class="secondary" hidden>연결 해제</button><small>로그인과 열린 탭은 이 브라우저에 유지돼요. 변경은 누비의 기존 승인을 거쳐 실행합니다.</small></main><script type="module" src="connect.js"></script></body></html>
