appId: nubi.workspace
productName: 누비 Workspace
executableName: Nubi Workspace
artifactName: Nubi-Workspace-beta-${version}-${arch}-Setup.${ext}
electronVersion: 42.11.10
asar: true
asarUnpack:
  - lib/backend/openwiki-update/openwiki/skills/**/*
  - node_modules/node-pty/**/*
  - node_modules/@vscode/ripgrep-*/**/*
  - "**/*.node"
npmRebuild: false
# Fastest installation (user decision 2026-10-14): the installer stores files without compression, so setup is a copy,
# not an extraction. The download is larger; the intranet mirror absorbs that.
compression: store
# Release protection: no NODE_OPTIONS against the app, the asar header is validated and only the asar is loaded.
# runAsNode stays on because the runtime worker is forked with ELECTRON_RUN_AS_NODE (electron-app/main.cjs).
# --inspect stays allowed: the packaged and installed app are verified by Playwright, which attaches through it
# (CI run 38504518097 timed out with the fuse off). docs/PACKAGING-SECURITY-2026-10-14.md lists the follow-up.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
nodeGypRebuild: false
directories:
  output: ../release/windows
  buildResources: resources
files:
  - "!node_modules/node-pty/**/*.pdb"
  - "!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**/*"
  - "!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64}/**/*"
  - lib/**/*
  - launcher.cjs
  - package.json
extraResources:
  - from: ../third-party/pop3
    to: licenses/pop3
  - from: resources/git
    to: git
  - from: resources/nubi.png
    to: nubi-icon.png
  - from: ../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: ../vendor/licenses
    to: licenses
win:
  icon: resources/nubi.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  include: nubi-installer.nsh
  installerHeader: nsis-generated/installer-header.bmp
  installerSidebar: nsis-generated/installer-sidebar.bmp
  uninstallerSidebar: nsis-generated/installer-sidebar.bmp
  installerLanguages: [ko_KR]
  language: "1042"
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 누비 Workspace
  uninstallDisplayName: 누비 Workspace Beta ${version}
publish: null
